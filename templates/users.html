<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Time Saver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Time Saver - Usuários</a>
            <a href="/" class="btn btn-outline-light btn-sm">Voltar</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Usuários cadastrados</h5>
                <div id="users-table" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function(){
            fetch('/api/users')
                .then(r => r.json())
                .then(data => {
                    const table = new Tabulator('#users-table', {
                        data: Array.isArray(data) ? data : [],
                        layout: 'fitColumns',
                        placeholder: 'Nenhum usuário encontrado.',
                        columns: [
                            {title: 'ID', field: 'id', width: 80},
                            {title: 'Usuário', field: 'username'}
                        ]
                    });
                })
                .catch(() => {
                    document.getElementById('users-table').innerText = 'Erro ao carregar usuários.';
                });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
