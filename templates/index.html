<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Agenda Médica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        /* Botão calendário quadrado com ícone centralizado */
        #dataCalendarBtn {
            width: 40px;
            padding: 0.25rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.25rem;
        }
        #dataCalendarBtn svg {
            width: 18px;
            height: 18px;
            display: block;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Time Saver - Agenda Médica</a>
            <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h5 class="card-title mb-3">Cadastrar agendamento</h5>
                <form id="cadastroForm" class="row g-2">
                    <div class="col-md-2">
                        <div class="input-group">
                            <input type="text" class="form-control" id="data" placeholder="DD/MM/YYYY" inputmode="numeric" pattern="\d{2}/\d{2}/\d{4}" maxlength="10" required>
                            <button class="btn btn-outline-secondary" id="dataCalendarBtn" type="button" title="Abrir calendário" aria-label="Abrir calendário">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                            </button>
                            <input type="date" id="dataPicker" style="display:none;" aria-hidden="true">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <input type="time" class="form-control" id="horario" placeholder="Horário" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="paciente" placeholder="Paciente" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="cpf" placeholder="CPF" maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="medico" placeholder="Médico" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="especialidade" placeholder="Especialidade" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" class="form-control" id="convenio" placeholder="Convênio" required>
                    </div>
                    <div class="col-md-2">
                        <select id="status" class="form-select" required>
                            <option value="">Status</option>
                            <option value="Confirmado">Confirmado</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Salvar agendamento</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar por paciente, CPF ou médico...">
            </div>
        </div>

        <div id="mensagem" class="alert d-none"></div>
        <div id="acao-rapida" class="mb-3"></div>
        <div id="tabela-agenda" class="shadow-sm bg-white"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const msgBox = document.getElementById('mensagem');
            const acaoRapida = document.getElementById('acao-rapida');
            const cadastroForm = document.getElementById('cadastroForm');
            let table;
            let ultimoCadastroLocal = null;

            function buildRowData(rawItem, source, externalIndex) {
                const item = { ...rawItem };
                if (source === 'local') {
                    item._row_id = `local-${item.id}`;
                } else {
                    item._row_id = `externo-${externalIndex}`;
                }
                item._is_local = source === 'local';
                return item;
            }
            
            function showMessage(text, type, timeout=4000) {
                msgBox.className = `alert alert-${type} mt-3 alert-dismissible`;
                msgBox.innerHTML = text + '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
                msgBox.classList.remove('d-none');
                if (timeout) {
                    setTimeout(() => { msgBox.className = 'd-none'; msgBox.innerText = ''; }, timeout);
                }
            }

            function limparAcaoRapida() {
                acaoRapida.innerHTML = '';
                ultimoCadastroLocal = null;
            }

            function renderAcaoRapida(agendamento) {
                acaoRapida.innerHTML = `
                    <button id="deletar-ultimo" class="btn btn-outline-danger btn-sm" type="button">
                        Deletar último cadastro salvo
                    </button>
                `;
                ultimoCadastroLocal = agendamento;

                document.getElementById('deletar-ultimo').addEventListener('click', function() {
                    if (!ultimoCadastroLocal) {
                        return;
                    }

                    fetch(`/api/agendamentos/${ultimoCadastroLocal.id}`, {
                        method: 'DELETE'
                    })
                        .then(response => response.json().then(body => ({ ok: response.ok, body })))
                        .then(({ ok, body }) => {
                            if (!ok) {
                                showMessage(body.error || 'Falha ao deletar agendamento.', 'danger');
                                return;
                            }

                            const row = table.getRow(ultimoCadastroLocal._row_id);
                            if (row) {
                                row.delete();
                            }

                            limparAcaoRapida();
                            showMessage('Último cadastro removido com sucesso.', 'success');
                        })
                        .catch(() => {
                            showMessage('Erro inesperado ao deletar agendamento.', 'danger');
                        });
                });
            }

            function getFormData() {
                const rawDate = document.getElementById('data').value.trim();
                const isoDate = ddmmyyyyToIso(rawDate) || rawDate;
                return {
                    data: isoDate,
                    horario: document.getElementById('horario').value.trim(),
                    paciente: document.getElementById('paciente').value.trim(),
                    cpf: document.getElementById('cpf').value.trim(),
                    medico: document.getElementById('medico').value.trim(),
                    especialidade: document.getElementById('especialidade').value.trim(),
                    convenio: document.getElementById('convenio').value.trim(),
                    status: document.getElementById('status').value.trim()
                };
            }

            // Formatar CPF enquanto digita (000.000.000-00)
            const cpfInput = document.getElementById('cpf');
            function formatCPF(value){
                const digits = value.replace(/\D/g,'').slice(0,11);
                let res = digits;
                if(digits.length > 9) res = digits.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
                else if(digits.length > 6) res = digits.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
                else if(digits.length > 3) res = digits.replace(/(\d{3})(\d{1,3})/, '$1.$2');
                return res;
            }
            cpfInput.addEventListener('input', (e)=>{ const pos = e.target.selectionStart; e.target.value = formatCPF(e.target.value); });

            // Impedir datas passadas: ajustar min do input date e validar no submit
            const dateInput = document.getElementById('data');
            const timeInput = document.getElementById('horario');
            function setMinDateTime(){
                const now = new Date();
                const todayIso = now.toISOString().split('T')[0];
                // guardamos min em data-min para referência
                dateInput.setAttribute('data-min', todayIso);
                // ajustar minDate do flatpickr também
                try { fp.set('minDate', todayIso); } catch(e) {}
                // se a data selecionada for hoje, ajuste min do horário para agora
                const selectedIso = ddmmyyyyToIso(dateInput.value || '');
                if(selectedIso === todayIso){
                    const hh = String(now.getHours()).padStart(2,'0');
                    const mm = String(now.getMinutes()).padStart(2,'0');
                    timeInput.setAttribute('min', `${hh}:${mm}`);
                } else {
                    timeInput.removeAttribute('min');
                }
            }
            // Funções para manipular formato DD/MM/YYYY <-> YYYY-MM-DD
            function ddmmyyyyToIso(v){
                if(!v) return '';
                const parts = v.split('/');
                if(parts.length !== 3) return v;
                const [d,m,y] = parts;
                if(d.length !== 2 || m.length !== 2 || y.length !== 4) return v;
                return `${y}-${m}-${d}`;
            }
            function isoToDdmm(v){
                if(!v) return '';
                const parts = v.split('-');
                if(parts.length !== 3) return v;
                const [y,m,d] = parts;
                return `${d.padStart(2,'0')}/${m.padStart(2,'0')}/${y}`;
            }

            // Formatar data enquanto digita (DD/MM/YYYY) e aceitar teclado numérico (NumLock)
            function formatDateInput(value){
                const digits = value.replace(/\D/g,'').slice(0,8);
                let res = digits;
                if(digits.length >= 5) res = digits.replace(/(\d{2})(\d{2})(\d{1,4})/, '$1/$2/$3');
                else if(digits.length >= 3) res = digits.replace(/(\d{2})(\d{1,2})/, '$1/$2');
                return res;
            }

            // Converter número de dígitos já digitados para posição do caret
            function digitCountToCaretPos(n){
                if(n <= 0) return 0;
                if(n <= 2) return n; // DD
                if(n <= 4) return n + 1; // DD/MM -> add one slash
                return n + 2; // DD/MM/YYYY -> add two slashes
            }

            const datePicker = document.getElementById('dataPicker');
            const calendarBtn = document.getElementById('dataCalendarBtn');

            // Inicializar Flatpickr no input oculto para não interferir na digitação manual
            const fp = flatpickr(datePicker, {
                dateFormat: 'd/m/Y',
                locale: 'pt',
                disableMobile: false,
                minDate: 'today',
                clickOpens: false,
                // Atualiza o input oculto e validações quando a data muda
                onChange: function(selectedDates, dateStr, instance){
                    if(selectedDates.length){
                        datePicker.value = selectedDates[0].toISOString().split('T')[0];
                        dateInput.value = isoToDdmm(datePicker.value);
                    } else {
                        datePicker.value = '';
                    }
                    setMinDateTime();
                },
                onReady: function(selectedDates, dateStr, instance){
                    // Garante minDate coerente ao iniciar
                    setMinDateTime();
                }
            });

            // Ao clicar no botão, abre o flatpickr calendar
            calendarBtn.addEventListener('click', function(){
                try { fp.open(); } catch(e) { dateInput.focus(); }
            });

            // Use beforeinput to reliably handle numeric entry (including numpad) and deletions
            dateInput.addEventListener('beforeinput', function(e){
                const el = e.target;
                const type = e.inputType;
                const data = e.data;

                // Helper to set caret after N digits
                function setCaretAfterDigits(n){
                    const pos = digitCountToCaretPos(n);
                    el.setSelectionRange(pos,pos);
                }

                // Insert digit
                if(type === 'insertText' && /\d/.test(data)){
                    e.preventDefault();
                    const caret = el.selectionStart || 0;
                    const digitsBefore = (el.value.slice(0, caret).match(/\d/g) || []).length;
                    let raw = (el.value.replace(/\D/g,'')).slice(0,8);
                    raw = (raw.slice(0,digitsBefore) + data + raw.slice(digitsBefore)).slice(0,8);
                    el.value = formatDateInput(raw);
                        const newPos = digitCountToCaretPos(digitsBefore + 1);
                        el.setSelectionRange(newPos, newPos);
                    const iso = ddmmyyyyToIso(el.value);
                    if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) datePicker.value = iso;
                    setMinDateTime();
                    return;
                }

                // Backspace
                if(type === 'deleteContentBackward'){
                    e.preventDefault();
                    const caret = el.selectionStart || 0;
                    const digitsBefore = (el.value.slice(0, caret).match(/\d/g) || []).length;
                    if(digitsBefore === 0) return; // nothing to delete
                    let raw = el.value.replace(/\D/g,'');
                    raw = raw.slice(0, digitsBefore-1) + raw.slice(digitsBefore);
                    el.value = formatDateInput(raw);
                    const newPos = digitCountToCaretPos(Math.max(0, digitsBefore-1));
                    el.setSelectionRange(newPos, newPos);
                    const iso = ddmmyyyyToIso(el.value);
                    if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) datePicker.value = iso;
                    setMinDateTime();
                    return;
                }

                // Delete (forward)
                if(type === 'deleteContentForward'){
                    e.preventDefault();
                    const caret = el.selectionStart || 0;
                    const digitsBefore = (el.value.slice(0, caret).match(/\d/g) || []).length;
                    let raw = el.value.replace(/\D/g,'');
                    raw = raw.slice(0, digitsBefore) + raw.slice(digitsBefore+1);
                    el.value = formatDateInput(raw);
                    const newPosDel = digitCountToCaretPos(digitsBefore);
                    el.setSelectionRange(newPosDel, newPosDel);
                    const iso = ddmmyyyyToIso(el.value);
                    if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) datePicker.value = iso;
                    setMinDateTime();
                    return;
                }

                // For other input types (paste, etc.) allow default and then normalize on paste event
            });

            // Handle paste: extract digits from clipboard and format into the field
            dateInput.addEventListener('paste', function(e){
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text') || '';
                const digits = paste.replace(/\D/g,'');
                if(!digits) return;
                const el = e.target;
                const caret = el.selectionStart || 0;
                const digitsBefore = (el.value.slice(0, caret).match(/\d/g) || []).length;
                let raw = (el.value.replace(/\D/g,'')).slice(0,8);
                raw = (raw.slice(0,digitsBefore) + digits + raw.slice(digitsBefore)).slice(0,8);
                el.value = formatDateInput(raw);
                const newPos = digitCountToCaretPos(Math.min(8, digitsBefore + digits.length));
                el.setSelectionRange(newPos, newPos);
                const iso = ddmmyyyyToIso(el.value);
                if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) datePicker.value = iso;
                setMinDateTime();
            });

            // Handle paste: extract digits and format
            dateInput.addEventListener('keydown', function(e){
                const el = e.target;
                const caret = el.selectionStart || 0;

                // Allow navigation keys
                const navKeys = ['ArrowLeft','ArrowRight','Tab','Home','End','Shift','Control','Alt'];
                if(navKeys.includes(e.key)) return;

                // Determine digit from various key properties (Chrome/Windows compatibility)
                let digit = null;
                if(/^[0-9]$/.test(e.key)) digit = e.key;
                else if(e.code && e.code.startsWith('Numpad')){
                    const c = e.code.replace('Numpad','');
                    if(/^[0-9]$/.test(c)) digit = c;
                } else if(typeof e.which === 'number' && e.which >= 96 && e.which <= 105){
                    digit = String(e.which - 96);
                }

                if(digit !== null){
                    e.preventDefault();
                    const digitsBefore = (el.value.slice(0, caret).match(/\d/g) || []).length;
                    let raw = (el.value.replace(/\D/g,'')).slice(0,8);
                    raw = (raw.slice(0,digitsBefore) + digit + raw.slice(digitsBefore)).slice(0,8);
                    el.value = formatDateInput(raw);
                    const newPos = digitCountToCaretPos(digitsBefore+1);
                    el.setSelectionRange(newPos,newPos);
                    const iso = ddmmyyyyToIso(el.value);
                    if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) datePicker.value = iso;
                    setMinDateTime();
                    return;
                }

                // Handle Backspace/Delete
                if(e.key === 'Backspace' || e.key === 'Delete'){
                    e.preventDefault();
                    const digitsBefore = (el.value.slice(0, caret).match(/\d/g) || []).length;
                    let raw = el.value.replace(/\D/g,'');
                    if(e.key === 'Backspace'){
                        if(digitsBefore === 0) return;
                        raw = raw.slice(0, digitsBefore-1) + raw.slice(digitsBefore);
                        const targetDigits = Math.max(0, digitsBefore-1);
                        el.value = formatDateInput(raw);
                        const newPos = digitCountToCaretPos(targetDigits);
                        el.setSelectionRange(newPos,newPos);
                    } else {
                        // Delete forward
                        raw = raw.slice(0, digitsBefore) + raw.slice(digitsBefore+1);
                        el.value = formatDateInput(raw);
                        const newPos = digitCountToCaretPos(digitsBefore);
                        el.setSelectionRange(newPos,newPos);
                    }
                    const iso = ddmmyyyyToIso(el.value);
                    if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) datePicker.value = iso;
                    setMinDateTime();
                    return;
                }
            });

            // Fallback: normaliza o valor em entradas aceleradas ou eventos que o navegador não trate corretamente
            dateInput.addEventListener('input', function(e){
                const el = e.target;
                const caret = el.selectionStart || el.value.length;
                const digitsBefore = (el.value.slice(0, caret).match(/\d/g) || []).length;
                const raw = el.value.replace(/\D/g,'').slice(0,8);
                const formatted = formatDateInput(raw);

                if(el.value !== formatted){
                    el.value = formatted;
                    const newPos = digitCountToCaretPos(Math.min(digitsBefore, raw.length));
                    el.setSelectionRange(newPos, newPos);
                }

                const iso = ddmmyyyyToIso(el.value);
                if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) datePicker.value = iso;
                setMinDateTime();
            });

            // Atualiza min quando a data muda ou ao carregar
            dateInput.addEventListener('change', setMinDateTime);
            window.addEventListener('load', setMinDateTime);

            Promise.all([
                fetch('/api/proxy/agendamentos')
                    .then(response => response.json())
                    .catch(() => ({ error: 'Serviço de agendamentos temporariamente indisponível.' })),
                fetch('/api/agendamentos')
                    .then(response => response.json())
                    .catch(() => ({ error: 'Falha ao carregar agendamentos locais.' }))
            ])
                .then(([externos, locais]) => {
                    const externosLista = Array.isArray(externos) ? externos : [];
                    const locaisLista = Array.isArray(locais) ? locais : [];
                    const locaisComMeta = locaisLista.map(item => buildRowData(item, 'local'));
                    const externosComMeta = externosLista.map((item, index) => buildRowData(item, 'externo', index));

                    if (locais.error) {
                        showMessage(locais.error, 'danger');
                        return;
                    }

                    if (externos.warning) {
                        showMessage(externos.warning, 'warning');
                    }

                    table = new Tabulator("#tabela-agenda", {
                        data: [...locaisComMeta, ...externosComMeta],
                        index: "_row_id",
                        layout: "fitColumns",
                        responsiveLayout: "collapse",
                        placeholder: "Nenhum agendamento encontrado.",
                        columns: [
                            {title:"Data", field:"data", width: 100},
                            {title:"Horário", field:"horario", width: 90},
                            {title:"Paciente", field:"paciente"},
                            {title:"CPF", field:"cpf"},
                            {title:"Médico", field:"medico"},
                            {title:"Especialidade", field:"especialidade"},
                            {title:"Convênio", field:"convenio"},
                            {title:"Status", field:"status"},
                            {
                                title:"Ações",
                                field:"_is_local",
                                hozAlign:"center",
                                width: 120,
                                formatter: function(cell) {
                                    return cell.getValue() ? "<button class='btn btn-sm btn-outline-danger'>Deletar</button>" : "";
                                },
                                cellClick: function(e, cell) {
                                    const rowData = cell.getRow().getData();
                                    if (!rowData._is_local) {
                                        return;
                                    }

                                    fetch(`/api/agendamentos/${rowData.id}`, {
                                        method: 'DELETE'
                                    })
                                        .then(response => response.json().then(body => ({ ok: response.ok, body })))
                                        .then(({ ok, body }) => {
                                            if (!ok) {
                                                showMessage(body.error || 'Falha ao deletar agendamento.', 'danger');
                                                return;
                                            }

                                            cell.getRow().delete();
                                            if (ultimoCadastroLocal && ultimoCadastroLocal.id === rowData.id) {
                                                limparAcaoRapida();
                                            }
                                            showMessage('Agendamento deletado com sucesso.', 'success');
                                        })
                                        .catch(() => {
                                            showMessage('Erro inesperado ao deletar agendamento.', 'danger');
                                        });
                                }
                            }
                        ]
                    });

                    document.getElementById("searchInput").addEventListener("input", function(e){
                        const termo = e.target.value.toLowerCase();
                        table.setFilter(function(linha){
                            const paciente = (linha.paciente || '').toLowerCase();
                            const cpf = (linha.cpf || '').toLowerCase();
                            const medico = (linha.medico || '').toLowerCase();

                            return paciente.includes(termo) ||
                                   cpf.includes(termo) ||
                                   medico.includes(termo);
                        });

                        setTimeout(() => {
                            if(table.getData("active").length === 0){
                                showMessage("Nenhum registro encontrado para esta busca.", "info");
                            } else {
                                msgBox.className = "d-none";
                            }
                        }, 100);
                    });

                    cadastroForm.addEventListener('submit', function(event) {
                        event.preventDefault();

                        const payload = getFormData();

                        // Validação: não permitir data/hora no passado
                        if(!payload.data || !payload.horario){
                            showMessage('Preencha data e horário.', 'warning');
                            return;
                        }
                        const dt = new Date(payload.data + 'T' + payload.horario);
                        const now = new Date();
                        if(dt < now){
                            showMessage('Data e horário devem ser futuros.', 'warning');
                            return;
                        }

                        fetch('/api/agendamentos', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        })
                            .then(response => response.json().then(body => ({ ok: response.ok, body })))
                            .then(({ ok, body }) => {
                                if (!ok) {
                                    showMessage(body.error || 'Falha ao cadastrar agendamento.', 'danger');
                                    return;
                                }

                                const novoItem = buildRowData(body, 'local');
                                table.addData([novoItem], true);
                                cadastroForm.reset();
                                showMessage('Agendamento cadastrado com sucesso.', 'success');
                                renderAcaoRapida(novoItem);
                            })
                            .catch(() => {
                                showMessage('Erro inesperado ao cadastrar agendamento.', 'danger');
                            });
                    });
                })
                .catch(() => {
                    showMessage("Erro inesperado ao conectar com o servidor.", "danger");
                });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
